name: CI

on:
  push:
    branches: [ main, develop, modern_package ]
  pull_request:
    branches: [ main, develop, modern_package ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest numpy pandas xarray "dask[distributed]" netCDF4 pyyaml cartopy scipy

    - name: Lint with Ruff
      run: ruff check .

    - name: Check formatting with Ruff
      run: ruff format --check .

    - name: Run tests with pytest
      run: pytest tests/
