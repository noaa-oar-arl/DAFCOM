[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafcom"
version = "0.1.0"
description = "Configurable UFS air composition forecasting and Ursa workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "pydantic>=2",
  "numpy>=1.24",
  "pandas>=2",
  "xarray>=2023.1",
  "scipy>=1.10",
  "netCDF4>=1.6",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
ml = ["tensorflow>=2.15", "xgboost>=2"]
regrid = ["xesmf>=0.8"]
excel = ["openpyxl>=3.1"]
test = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
dafcom = "dafcom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dafcom*"]

[tool.setuptools.data-files]
"share/dafcom/configs" = ["configs/ursa.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
